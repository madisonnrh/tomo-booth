<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Photo Booth</title>
        <link rel="stylesheet" href="maddiebooth_1789665275835.css" />
    </head>

    <body>
        <div id="app">
            <section id="welcome" class="screen active">
                <h1>
                    PHOTO<br />
                    BOOTH
                </h1>

                <p>Take four photos. Have fun.</p>

                <button class="start-button" id="start-button">START →</button>

                <p
                    id="welcome-help"
                    class="welcome-help"
                    role="status"
                    aria-live="polite"
                ></p>
            </section>

            <section id="camera-screen" class="screen">
                <div id="setup-controls" class="setup-controls">
                    <h2>GET READY</h2>
                    <p>Choose a look, then press start when you are ready.</p>

                    <div
                        class="filter-picker"
                        role="group"
                        aria-label="Photo filter"
                    >
                        <button
                            type="button"
                            class="filter-button active"
                            id="color-filter"
                            aria-pressed="true"
                        >
                            COLOR
                        </button>
                        <button
                            type="button"
                            class="filter-button"
                            id="bw-filter"
                            aria-pressed="false"
                        >
                            B&amp;W
                        </button>
                    </div>

                    <button class="button" id="ready-button" type="button">
                        READY — TAKE PHOTOS →
                    </button>

                    <p
                        id="setup-help"
                        class="camera-help"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>

                <div id="photo-status" hidden>PHOTO 1 OF 4</div>

                <p
                    id="camera-help"
                    class="camera-help"
                    role="status"
                    aria-live="polite"
                ></p>

                <div class="camera-container">
                    <video id="video" autoplay muted playsinline></video>
                    <div id="film-grain" aria-hidden="true"></div>
                    <div id="countdown"></div>
                    <div id="flash"></div>
                </div>
            </section>

            <section id="results" class="screen">
                <h2>YOUR PHOTOS</h2>

                <div class="strip-previews">
                    <div class="strip-option">
                        <h3>1 × 4</h3>

                        <img
                            id="strip-1x4"
                            class="strip-preview"
                            alt="1x4 photo strip"
                        />

                        <button class="button" id="download-1x4">
                            DOWNLOAD 1×4
                        </button>
                    </div>

                    <div class="strip-option">
                        <h3>2 × 4</h3>

                        <img
                            id="strip-2x4"
                            class="strip-preview"
                            alt="2x4 photo strip"
                        />

                        <div class="button-row">
                            <button class="button" id="download-2x4">
                                DOWNLOAD 2×4
                            </button>

                            <button class="button print" id="print-2x4">
                                PRINT 2×4
                            </button>
                        </div>
                    </div>
                </div>

                <button class="button secondary" id="restart">
                    START OVER
                </button>
            </section>
        </div>

        <canvas id="photo-canvas"></canvas>
        <canvas id="strip-canvas-1x4"></canvas>
        <canvas id="strip-canvas-2x4"></canvas>

        <div id="print-image">
            <img id="print-image-content" alt="Printable 2x4 strip" />
        </div>

        <script src="maddiebooth_1789665275835.js"></script>
    </body>
</html>
